b,

}

.table :is(th, td):last-child {

.table thead th {

  width: 100%;
  padding: 0;

.card {

  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

}

.tooltip {

  top: 0;
  left: 0;

    calc(100vw - 10px)

  background: var(--popover);

  flex-direction: column;

}

.sr-only {

.viz-controls {

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);

    function buildRelationalTableNames(config) {
      return Array.from({ length: config.tableCount }, (_, index) =&gt; {
        if (index &lt; config.tables.length) return config.tables[index];
        const stem = tableNameStems[(index - config.tables.length) % tableNameStems.length];
        const partition = Math.floor((index - config.tables.length) / tableNameStems.length) + 1;
        return partition === 1 ? stem : stem + &quot;_p&quot; + String(partition).padStart(2, &quot;0&quot;);
      });
    }

    function generateRelationalRows(sample, count) {

    function setRelationalControl(type) {
      const panel = root.querySelector(&quot;[data-rel-control-panel]&quot;);

      const value = root.querySelector(&quot;[data-rel-control-value]&quot;);
      if (currentRelationalControl === type &amp;&amp; !panel.hidden) {
        panel.hidden = true;
        currentRelationalControl = &quot;&quot;;
        root.querySelectorAll(&quot;[data-rel-control]&quot;).forEach((item) =&gt; item.classList.remove(&quot;active&quot;));
        return;
      }
      currentRelationalControl = type;
      panel.hidden = false;
      root.querySelectorAll(&quot;[data-rel-control]&quot;).forEach((item) =&gt; item.classList.toggle(&quot;active&quot;, item.dataset.relControl === type));
      const options = type === &quot;filter&quot; ? [&quot;包含&quot;, &quot;等于&quot;, &quot;不等于&quot;, &quot;为空&quot;] : type === &quot;sort&quot; ? [&quot;升序&quot;, &quot;降序&quot;, &quot;默认顺序&quot;] : [&quot;自动适配&quot;, &quot;加宽&quot;, &quot;缩小&quot;];
      operator.replaceChildren(...options.map((label) =&gt; {
        const option = document.createElement(&quot;option&quot;);

      }));

    function openBrowse(card) {

    function showEditor(tab = &quot;general&quot;, editing = false) {

      root.querySelector(&quot;[data-editor-title]&quot;).textContent = editing ? &quot;编辑连接&quot; : &quot;创建连接&quot;;
      if (!editing) {

          option.classList.remove(&quot;enabled&quot;);

    function setEditorTab(tab) {
      const step = tab === &quot;general&quot; ? 1 : 3;
      if ([&quot;ssl&quot;, &quot;ssh&quot;, &quot;http&quot;].includes(tab)) {
        const option = root.querySelector(&#x27;[data-security-option=&quot;&#x27; + tab + &#x27;&quot;]&#x27;);

    function updateEditorReview() {
      const environment = root.querySelector(&#x27;[data-environment] input:checked&#x27;);
      const enabledSecurity = Array.from(root.querySelectorAll(&#x27;[data-security-option] [data-toggle-indicator]:checked&#x27;)).map((input) =&gt; input.dataset.toggleIndicator === &quot;ssh&quot; ? (connectionSshSource === &quot;temporary&quot; ? &quot;SSH（当前连接配置）&quot; : &quot;SSH（已保存模板）&quot;) : input.dataset.toggleIndicator.toUpperCase());
      const username = root.querySelector(&quot;[data-field-username]&quot;).value.trim();
      root.querySelector(&quot;[data-review-name]&quot;).textContent = root.querySelector(&quot;[data-field-name]&quot;).value.trim() || &quot;未命名连接&quot;;
      root.querySelector(&quot;[data-review-type]&quot;).textContent = selectedConnectionType;
      root.querySelector(&quot;[data-review-environment]&quot;).textContent = environment ? environment.value : &quot;开发&quot;;
      root.querySelector(&quot;[data-review-endpoint]&quot;).textContent = (root.querySelector(&quot;[data-field-host]&quot;).value.trim() || &quot;未填写主机&quot;) + &quot;:&quot; + root.querySelector(&quot;[data-field-port]&quot;).value;
      root.querySelector(&quot;[data-review-auth]&quot;).textContent = username ? username + &quot; · 密码认证&quot; : &quot;未填写用户名&quot;;
      root.querySelector(&quot;[data-review-security]&quot;).textContent = enabledSecurity.length ? enabledSecurity.join(&quot; + &quot;) : &quot;未启用&quot;;
      root.querySelector(&quot;[data-review-write]&quot;).textContent = root.querySelector(&quot;[data-read-only]&quot;).checked ? &quot;只读&quot; : &quot;允许写入&quot;;
    }

    function setEditorStep(step) {
      currentEditorStep = Math.max(1, Math.min(4, Number(step)));
      const subtitles = {
        1: &quot;先确定连接的用途与数据库类型&quot;,
        2: &quot;填写服务器地址与数据库账号&quot;,
        3: &quot;按网络情况配置加密和隧道&quot;,
        4: &quot;测试连接并保存到本机&quot;
      };
      root.querySelectorAll(&quot;[data-editor-step]&quot;).forEach((panel) =&gt; panel.hidden = Number(panel.dataset.editorStep) !== currentEditorStep);
      root.querySelectorAll(&quot;[data-editor-step-tab]&quot;).forEach((button) =&gt; {
        const buttonStep = Number(button.dataset.editorStepTab);
        button.classList.toggle(&quot;active&quot;, buttonStep === currentEditorStep);
        button.classList.toggle(&quot;completed&quot;, buttonStep &lt; currentEditorStep);
      });
      root.querySelector(&quot;[data-editor-progress-label]&quot;).textContent = &quot;步骤 &quot; + currentEditorStep + &quot; / 4&quot;;
      root.querySelector(&quot;[data-editor-subtitle]&quot;).textContent = subtitles[currentEditorStep];
      root.querySelector(&quot;[data-editor-back]&quot;).textContent = currentEditorStep === 1 ? &quot;取消&quot; : &quot;上一步&quot;;
      root.querySelector(&quot;[data-editor-next]&quot;).textContent = currentEditorStep === 4 ? (editingConnection ? &quot;保存修改&quot; : &quot;保存连接&quot;) : &quot;下一步&quot;;
      if (currentEditorStep === 4) updateEditorReview();
      editor.scrollTop = 0;
    }

    function applyConnectionFilter() {
      const query = root.querySelector(&quot;[data-connection-search]&quot;).value.trim().toLowerCase();
      root.querySelectorAll(&quot;[data-connection-card]&quot;).forEach((card) =&gt; {
        const matchesQuery = card.dataset.name.toLowerCase().includes(query);
        const matchesFilter =
          activeFilter === &quot;all&quot; ||
          (activeFilter === &quot;favorite&quot; &amp;&amp; card.dataset.favorite === &quot;true&quot;) ||
          card.dataset.env === activeFilter;
        const matchesType = advancedFilters.type === &quot;all&quot; || card.dataset.dbType === advancedFilters.type;
        const matchesEnvironment = advancedFilters.environment === &quot;all&quot; || card.dataset.env === advancedFilters.environment;
        const matchesTransport = advancedFilters.transport === &quot;all&quot; || (card.dataset.transport || &quot;&quot;).split(&quot; &quot;).includes(advancedFilters.transport);
        const matchesTag = !advancedFilters.tag || card.dataset.name.toLowerCase().includes(advancedFilters.tag.toLowerCase());
        const matchesFavorite = !advancedFilters.favorite || card.dataset.favorite === &quot;true&quot;;
        const matchesProduction = !advancedFilters.production || card.dataset.env === &quot;production&quot;;
        card.hidden = !(matchesQuery &amp;&amp; matchesFilter &amp;&amp; matchesType &amp;&amp; matchesEnvironment &amp;&amp; matchesTransport &amp;&amp; matchesTag &amp;&amp; matchesFavorite &amp;&amp; matchesProduction);
      });
      root.querySelectorAll(&quot;[data-group]&quot;).forEach((group) =&gt; {
        const visible = Array.from(group.querySelectorAll(&quot;[data-connection-card]&quot;)).filter((card) =&gt; !card.hidden).length;
        group.querySelector(&quot;[data-group-count]&quot;).textContent = String(visible);
        group.hidden = visible === 0;
      });
    }

    function advancedFilterCount() {
      return [
        advancedFilters.type !== &quot;all&quot;,
        advancedFilters.environment !== &quot;all&quot;,
        advancedFilters.transport !== &quot;all&quot;,
        Boolean(advancedFilters.tag),
        advancedFilters.favorite,
        advancedFilters.production
      ].filter(Boolean).length;
    }

    function syncAdvancedSearchButton() {
      const button = root.querySelector(&quot;[data-toggle-advanced-search]&quot;);
      const panel = root.querySelector(&quot;[data-advanced-search]&quot;);
      const count = advancedFilterCount();
      button.classList.toggle(&quot;active&quot;, !panel.hidden || count &gt; 0);
      button.setAttribute(&quot;aria-expanded&quot;, String(!panel.hidden));
      button.setAttribute(&quot;aria-label&quot;, count ? &quot;高级搜索，已应用 &quot; + count + &quot; 个条件&quot; : &quot;打开高级搜索&quot;);
    }

    function resetAdvancedSearch() {
      advancedFilters = { type: &quot;all&quot;, environment: &quot;all&quot;, transport: &quot;all&quot;, tag: &quot;&quot;, favorite: false, production: false };
      root.querySelector(&quot;[data-advanced-type]&quot;).value = &quot;all&quot;;
      root.querySelector(&quot;[data-advanced-environment]&quot;).value = &quot;all&quot;;
      root.querySelector(&quot;[data-advanced-transport]&quot;).value = &quot;all&quot;;
      root.querySelector(&quot;[data-advanced-tag]&quot;).value = &quot;&quot;;
      root.querySelector(&quot;[data-advanced-favorite]&quot;).checked = false;
      root.querySelector(&quot;[data-advanced-production]&quot;).checked = false;
      applyConnectionFilter();
      syncAdvancedSearchButton();
    }

    function syncSortButton() {
      const button = root.querySelector(&quot;[data-toggle-sort]&quot;);
      const modal = root.querySelector(&quot;[data-sort-modal]&quot;);
      button.classList.toggle(&quot;active&quot;, !modal.hidden || activeSortMode !== &quot;recent&quot;);
      button.setAttribute(&quot;aria-expanded&quot;, String(!modal.hidden));
      button.setAttribute(&quot;aria-label&quot;, activeSortMode === &quot;recent&quot; ? &quot;连接排序&quot; : &quot;连接排序，当前为&quot; + ({ name: &quot;名称&quot;, environment: &quot;环境优先&quot;, pinned: &quot;置顶优先&quot; }[activeSortMode] || &quot;最近使用&quot;));
    }

    function setSortMode(mode) {
      pendingSortMode = mode;
      root.querySelectorAll(&quot;[data-sort-mode]&quot;).forEach((button) =&gt; button.classList.toggle(&quot;active&quot;, button.dataset.sortMode === mode));
      root.querySelector(&quot;[data-sort-list]&quot;).hidden = true;
      const hints = {
        recent: &quot;最近打开的连接排在前面。&quot;,
        name: &quot;按连接名称的拼音顺序排列。&quot;,
        environment: &quot;生产、预发、开发依次排列。&quot;,
        pinned: &quot;已置顶的连接优先显示，其余连接保持默认顺序。&quot;
      };
      root.querySelector(&quot;[data-sort-hint]&quot;).textContent = hints[mode];

    function currentGroupOrder() {
      return Array.from(root.querySelectorAll(&#x27;[data-page=&quot;connections&quot;] [data-group]&#x27;)).map((group) =&gt; group.dataset.group);
    }

    function syncSortListFromPage() {
      const list = root.querySelector(&quot;[data-sort-list]&quot;);
      currentGroupOrder().forEach((type) =&gt; {
        const item = list.querySelector(&#x27;[data-sort-item=&quot;&#x27; + type + &#x27;&quot;]&#x27;);
        if (item) list.appendChild(item);
      });
    }

    function applyGroupOrder(order) {
      const addButton = root.querySelector(&quot;.cc-add&quot;);
      order.forEach((type) =&gt; {
        const group = root.querySelector(&#x27;[data-group=&quot;&#x27; + type + &#x27;&quot;]&#x27;);
        if (group) addButton.before(group);
      });
    }

    function sortedGroupOrder(mode) {
      const groups = Array.from(root.querySelectorAll(&#x27;[data-page=&quot;connections&quot;] [data-group]&#x27;));
      if (mode === &quot;recent&quot;) return [...defaultConnectionOrder];
      if (mode === &quot;pinned&quot;) {
        return groups.sort((left, right) =&gt; {
          const leftPinned = left.querySelector(&quot;[data-connection-card]&quot;).dataset.pinned === &quot;true&quot;;
          const rightPinned = right.querySelector(&quot;[data-connection-card]&quot;).dataset.pinned === &quot;true&quot;;
          if (leftPinned !== rightPinned) return leftPinned ? -1 : 1;
          return defaultConnectionOrder.indexOf(left.dataset.group) - defaultConnectionOrder.indexOf(right.dataset.group);
        }).map((group) =&gt; group.dataset.group);
      }
      if (mode === &quot;name&quot;) {
        return groups.sort((left, right) =&gt; left.querySelector(&quot;[data-connection-card] strong&quot;).textContent.localeCompare(right.querySelector(&quot;[data-connection-card] strong&quot;).textContent, &quot;zh-CN&quot;)).map((group) =&gt; group.dataset.group);
      }
      const environmentRank = { production: 0, staging: 1, development: 2 };
      return groups.sort((left, right) =&gt; {
        const leftEnv = left.querySelector(&quot;[data-connection-card]&quot;).dataset.env;
        const rightEnv = right.querySelector(&quot;[data-connection-card]&quot;).dataset.env;
        return environmentRank[leftEnv] - environmentRank[rightEnv];
      }).map((group) =&gt; group.dataset.group);
    }

    root.addEventListener(&quot;click&quot;, (event) =&gt; {
      const redisRow = event.target.closest(&quot;[data-open-redis-detail]&quot;);
      if (redisRow &amp;&amp; root.contains(redisRow)) {
        const valueType = redisRow.querySelector(&quot;.cc-value-type&quot;)?.textContent || &quot;hash&quot;;
        openRecordInspector(&quot;redis&quot;, redisRow.dataset.redisKey, { valueType });
        return;
      }

      const relationalCell = event.target.closest(&quot;[data-rel-data-cell]&quot;);
      if (relationalCell &amp;&amp; root.contains(relationalCell)) {
        const [rowIndex, columnIndex] = relationalCell.dataset.relDataCell.split(&quot;:&quot;).map(Number);
        const relationalRow = relationalCell.closest(&quot;[data-rel-data-row]&quot;);
        root.querySelectorAll(&quot;[data-rel-data-row]&quot;).forEach((row) =&gt; row.classList.toggle(&quot;selected&quot;, row === relationalRow));
        currentSelectedRelationalRow = rowIndex;
        currentSelectedRelationalColumn = columnIndex;
        root.querySelector(&quot;[data-rel-cell-position]&quot;).textContent = &quot;ROW &quot; + (rowIndex + 1) + &quot; / COLUMN &quot; + (columnIndex + 1);
        root.querySelector(&quot;[data-rel-row-title]&quot;).textContent = currentRelationalColumns[columnIndex];
        root.querySelector(&quot;[data-rel-row-json]&quot;).value = currentRelationalRows[rowIndex][columnIndex] === null ? &quot;&quot; : String(currentRelationalRows[rowIndex][columnIndex]);
        root.querySelector(&quot;[data-rel-null]&quot;).checked = currentRelationalRows[rowIndex][columnIndex] === null;
        root.querySelector(&quot;[data-rel-row-json]&quot;).disabled = currentRelationalRows[rowIndex][columnIndex] === null;
        const primaryKey = columnIndex === 0;
        root.querySelector(&quot;[data-rel-cell-editor]&quot;).hidden = primaryKey;
        root.querySelector(&quot;[data-rel-cell-readonly]&quot;).hidden = !primaryKey;
        root.querySelector(&quot;[data-rel-cell-readonly]&quot;).textContent = String(currentRelationalRows[rowIndex][columnIndex]);
        root.querySelector(&quot;[data-rel-cell-lock]&quot;).hidden = !primaryKey;
        root.querySelector(&quot;[data-rel-edit-row]&quot;).hidden = primaryKey;
        root.querySelectorAll(&quot;[data-rel-copy-row], [data-rel-copy-cell], [data-rel-delete-row]&quot;).forEach((item) =&gt; item.hidden = false);
        root.querySelector(&quot;[data-rel-row-detail]&quot;).hidden = false;
        return;
      }

      const button = event.target.closest(&quot;button&quot;);
      if (!button || !root.contains(button)) return;

      if (button.dataset.go) {
        if (button.dataset.go === &quot;browse&quot;) showBrowsePanel(activeBrowseType);
        showPage(button.dataset.go);
        return;
      }
      if (button.dataset.sshSource) {
        setConnectionSshSource(button.dataset.sshSource);
        showToast(connectionSshSource === &quot;temporary&quot; ? &quot;当前配置只属于这个数据库连接&quot; : &quot;可直接引用本机跳板机模板&quot;);
        return;
      }
      if (button.dataset.addResource) {
        openResourceEditor(button.dataset.addResource);
        return;
      }
      if (button.dataset.editResource) {
        openResourceEditor(button.dataset.editResource, button.dataset.resourceId);
        return;
      }
      if (button.hasAttribute(&quot;data-close-resource-editor&quot;)) {
        closeResourceEditor();
        return;
      }
      if (button.hasAttribute(&quot;data-save-resource&quot;)) {
        saveResourceEditor();
        return;
      }
      if (button.hasAttribute(&quot;data-test-resource&quot;)) {
        const host = root.querySelector(&quot;[data-resource-host-address]&quot;).value.trim();
        if (resourceEditorKind === &quot;host&quot; &amp;&amp; !host) {
          showToast(&quot;请先填写 SSH 主机&quot;);
          return;
        }
        const original = button.textContent;
        button.disabled = true;
        button.textContent = &quot;测试中…&quot;;
        setTimeout(() =&gt; {
          button.disabled = false;
          button.textContent = original;
          if (resourceEditorKind === &quot;host&quot; &amp;&amp; !root.querySelector(&quot;[data-resource-host-fingerprint]&quot;).value.trim()) root.querySelector(&quot;[data-resource-host-fingerprint]&quot;).value = &quot;SHA256:7KpN…4cLs&quot;;
          showToast(resourceEditorKind === &quot;key&quot; ? &quot;密钥格式有效 · 公钥指纹已生成&quot; : &quot;跳板机连接成功 · 46 ms&quot;);
        }, 620);
        return;
      }
      if (button.dataset.resourceAction === &quot;fingerprint&quot;) {
        const key = sshKeyById(button.dataset.resourceId);
        showToast(&quot;已复制公钥指纹 · &quot; + key.fingerprint);
        return;
      }
      if (button.dataset.resourceAction === &quot;test&quot;) {
        const host = sshJumpHosts.find((item) =&gt; item.id === button.dataset.resourceId);
        const original = button.textContent;

        root.querySelector(&quot;[data-rel-null]&quot;).checked = false;
        root.querySelector(&quot;[data-rel-cell-editor]&quot;).hidden = false;
        root.querySelector(&quot;[data-rel-cell-readonly]&quot;).hidden = true;
        root.querySelector(&quot;[data-rel-cell-lock]&quot;).hidden = true;
        root.querySelectorAll(&quot;[data-rel-copy-row], [data-rel-copy-cell], [data-rel-delete-row]&quot;).forEach((item) =&gt; item.hidden = true);
        root.querySelector(&quot;[data-rel-edit-row]&quot;).hidden = false;
        root.querySelector(&quot;[data-rel-edit-row]&quot;).textContent = &quot;加入事务&quot;;
        root.querySelector(&quot;[data-rel-row-detail]&quot;).hidden = false;
        showToast(&quot;请填写新行字段后提交&quot;);
        return;
      }
      if (button.hasAttribute(&quot;data-back-rel-objects&quot;)) {
        root.querySelector(&quot;[data-rel-object-view]&quot;).hidden = false;
        root.querySelector(&quot;[data-rel-data-view]&quot;).hidden = true;
        root.querySelector(&#x27;[data-page=&quot;browse&quot;]&#x27;).scrollTop = relationalObjectScrollTop;
        return;
      }
      if (button.hasAttribute(&quot;data-rel-delete-row&quot;)) {
        if (currentSelectedRelationalRow !== null) {
          currentRelationalRows.splice(currentSelectedRelationalRow, 1);
          pendingRelationalChanges += 1;
          syncRelationalPending();
          renderRelationalRows();
          showToast(&quot;该行已加入删除事务&quot;);
        }
        currentSelectedRelationalRow = null;
        currentSelectedRelationalColumn = null;
        root.querySelector(&quot;[data-rel-row-detail]&quot;).hidden = true;
        return;
      }
      if (button.hasAttribute(&quot;data-rel-edit-row&quot;)) {
        const editorValue = root.querySelector(&quot;[data-rel-row-json]&quot;).value;
        if (currentSelectedRelationalRow === null) {
          try {
            const nextRow = JSON.parse(editorValue);
            currentRelationalRows.push(currentRelationalColumns.map((column) =&gt; nextRow[column] ?? null));
          } catch (_error) {
            showToast(&quot;新增数据不是有效 JSON&quot;);
            return;
          }
        } else {
          currentRelationalRows[currentSelectedRelationalRow][currentSelectedRelationalColumn] = root.querySelector(&quot;[data-rel-null]&quot;).checked ? null : editorValue;
        }
        pendingRelationalChanges += 1;
        syncRelationalPending();
        renderRelationalRows();
        root.querySelector(&quot;[data-rel-row-detail]&quot;).hidden = true;
        button.textContent = &quot;应用修改&quot;;
        showToast(&quot;修改已加入安全事务队列&quot;);
        return;
      }
      if (button.hasAttribute(&quot;data-rel-copy-row&quot;)) {
        showToast(&quot;整行数据已复制&quot;);
        return;
      }
      if (button.hasAttribute(&quot;data-rel-copy-cell&quot;)) {
        showToast(&quot;单元格内容已复制&quot;);
        return;
      }
      if (button.hasAttribute(&quot;data-rel-discard&quot;)) {
        renderRelationalTable(currentRelationalTableName);
        showToast(&quot;全部未提交变更已撤销&quot;);
        return;
      }
      if (button.hasAttribute(&quot;data-rel-commit&quot;)) {
        const count = pendingRelationalChanges;
        pendingRelationalChanges = 0;
        syncRelationalPending();
        showToast(&quot;事务已提交 · &quot; + count + &quot; 项变更&quot;);
        return;
      }
      if (button.hasAttribute(&quot;data-close-rel-row&quot;)) {
        root.querySelector(&quot;[data-rel-edit-row]&quot;).textContent = &quot;应用修改&quot;;
        root.querySelector(&quot;[data-rel-row-detail]&quot;).hidden = true;
        root.querySelectorAll(&quot;[data-rel-data-row]&quot;).forEach((row) =&gt; row.classList.remove(&quot;selected&quot;));
        return;
      }
      if (button.hasAttribute(&quot;data-close-record-inspector&quot;)) {
        root.querySelector(&quot;[data-record-inspector]&quot;).hidden = true;
        return;
      }
      if (button.dataset.recordTab) {
        setRecordTab(button.dataset.recordTab);
        return;
      }
      if (button.dataset.recordAction) {
        const actionLabel = button.textContent.trim();
        showToast(actionLabel + &quot; · &quot; + ({ redis: &quot;Redis Key&quot;, mongodb: &quot;MongoDB 文档&quot;, etcd: &quot;etcd 键&quot; }[currentRecordType] || &quot;数据&quot;));
        if (button.dataset.recordAction === &quot;delete&quot;) root.querySelector(&quot;[data-record-inspector]&quot;).hidden = true;
        return;
      }
      if (button.hasAttribute(&quot;data-back-redis-list&quot;)) {
        root.querySelector(&quot;[data-redis-list]&quot;).hidden = false;
        root.querySelector(&quot;[data-redis-detail]&quot;).hidden = true;
        return;
      }
      if (button.dataset.redisTab) {
        setRedisTab(button.dataset.redisTab);
        return;
      }
      if (button.dataset.mongoDocument) {
        const title = button.querySelector(&quot;strong&quot;).textContent;
        const status = button.lastElementChild.textContent;
        root.querySelector(&quot;[data-mongo-title]&quot;).textContent = title;
        root.querySelector(&quot;[data-mongo-status]&quot;).textContent = status;
        openRecordInspector(&quot;mongodb&quot;, title, { id: button.dataset.mongoDocument, status, oid: button.dataset.mongoOid, updatedAt: button.dataset.mongoUpdated });
        return;
      }
      if (button.dataset.mongoTab) {
        setMongoTab(button.dataset.mongoTab);
        return;
      }
      if (button.dataset.etcdKey) {
        root.querySelector(&quot;[data-etcd-selected-key]&quot;).textContent = button.dataset.etcdKey;
        root.querySelector(&quot;[data-etcd-selected-value]&quot;).textContent = button.dataset.etcdValue || etcdValues[button.dataset.etcdKey] || &quot;&quot;;
        openRecordInspector(&quot;etcd&quot;, button.dataset.etcdKey, { value: button.dataset.etcdValue });
        return;
      }
      if (button.dataset.etcdTab) {
        setEtcdTab(button.dataset.etcdTab);
        return;
      }
      if (button.dataset.feedback) {
        showToast(button.dataset.feedback);
        return;
      }
      const fallbackLabel = button.getAttribute(&quot;aria-label&quot;) || button.textContent.trim() || &quot;按钮&quot;;
      showToast(&quot;已执行 · &quot; + fallbackLabel);
    });

    root.addEventListener(&quot;change&quot;, (event) =&gt; {
      const input = event.target;
      if (input.hasAttribute(&quot;data-ssh-jump-select&quot;)) {
        syncConnectionSshPreview(true);
        showToast(input.value ? &quot;已选择跳板机&quot; : &quot;已清除跳板机选择&quot;);
        return;
      }
      if (input.hasAttribute(&quot;data-ssh-key-select&quot;)) {
        syncConnectionSshPreview(false);
        showToast(input.value ? &quot;已选择 SSH 密钥&quot; : &quot;已清除 SSH 密钥选择&quot;);
        return;
      }
      if (input.hasAttribute(&quot;data-ssh-temp-auth&quot;)) {
        syncTemporarySshAuth();
        showToast(input.value === &quot;password&quot; ? &quot;将使用当前连接的 SSH 密码&quot; : &quot;将引用本机安全密钥&quot;);
        return;
      }
      if (input.hasAttribute(&quot;data-ssh-save-template&quot;)) {
        root.querySelector(&quot;[data-ssh-template-name-wrap]&quot;).hidden = !input.checked;
        showToast(input.checked ? &quot;保存连接时会同时创建跳板机模板&quot; : &quot;不会加入跳板机资源库&quot;);

      if (input.hasAttribute(&quot;data-resource-key-method&quot;)) {
        const secret = root.querySelector(&quot;[data-resource-key-secret]&quot;);
        secret.disabled = input.value === &quot;在本机生成&quot;;
        secret.placeholder = input.value === &quot;在本机生成&quot; ? &quot;保存时在 Android 本机生成，不导出私钥&quot; : input.value === &quot;选择本机文件&quot; ? &quot;选择文件后只显示公钥指纹&quot; : &quot;-----BEGIN OPENSSH PRIVATE KEY-----&quot;;
        showToast(&quot;密钥导入方式已切换&quot;);
        return;
      }
      if (input.hasAttribute(&quot;data-query-connection&quot;)) {
        renderQueryAdapter(input.value);
        showToast(&quot;已加载 &quot; + queryAdapters[activeQueryAdapter].type + &quot; 查询模板&quot;);
        return;
      }
      if (input.hasAttribute(&quot;data-query-database&quot;) || input.hasAttribute(&quot;data-query-scope&quot;)) {
        root.querySelector(&quot;[data-query-result]&quot;).hidden = true;
        showToast(&quot;查询上下文已切换 · &quot; + input.value);
        return;
      }
      if (input.closest(&quot;[data-environment]&quot;)) {
        input.closest(&quot;[data-environment]&quot;).querySelectorAll(&quot;label&quot;).forEach((label) =&gt; label.classList.toggle(&quot;selected&quot;, label.contains(input)));
      }
      if (input.dataset.toggleIndicator) {
        const option = input.closest(&quot;[data-security-option]&quot;);
        option.classList.toggle(&quot;enabled&quot;, input.checked);
        option.querySelector(&quot;[data-security-fields]&quot;).hidden = !input.checked;
        showToast((input.checked ? &quot;已启用 &quot; : &quot;已关闭 &quot;) + input.dataset.toggleIndicator.toUpperCase());
      }
      if (input.hasAttribute(&quot;data-rel-page-size&quot;)) {
        currentRelationalPage = 1;
        root.querySelector(&quot;[data-rel-page-jump-panel]&quot;).hidden = true;
        root.querySelector(&quot;.cc-safe-edit&quot;).hidden = false;
        renderRelationalRows();
        showToast(&quot;每页显示已调整为 &quot; + input.value);
      }
      if (input.hasAttribute(&quot;data-rel-table-scope&quot;) || input.hasAttribute(&quot;data-rel-table-order&quot;)) {
        relationalTableVisibleCount = 30;
        renderRelationalTableList(root.querySelector(&quot;[data-rel-object-search]&quot;).value);
        showToast(&quot;表列表视图已更新&quot;);
      }
      if (input.hasAttribute(&quot;data-mongo-database&quot;)) {
        root.querySelector(&quot;[data-mongo-collection]&quot;).value = input.value === &quot;audit&quot; ? &quot;audit_logs&quot; : &quot;articles&quot;;
        activeMongoCollection = root.querySelector(&quot;[data-mongo-collection]&quot;).value;
        mongoVisibleCount = 24;
        root.querySelector(&quot;[data-mongo-search]&quot;).value = &quot;&quot;;
        renderMongoDocuments();
        root.querySelector(&#x27;[data-page=&quot;browse&quot;]&#x27;).scrollTop = 0;
        showToast(&quot;已切换数据库 · &quot; + input.value);
      }
      if (input.hasAttribute(&quot;data-mongo-collection&quot;)) {
        activeMongoCollection = input.value;
        mongoVisibleCount = 24;
        root.querySelector(&quot;[data-mongo-search]&quot;).value = &quot;&quot;;
        renderMongoDocuments();
        root.querySelector(&#x27;[data-page=&quot;browse&quot;]&#x27;).scrollTop = 0;
        showToast(&quot;已切换集合 · &quot; + input.options[input.selectedIndex].textContent.split(&quot; · &quot;)[0]);
      }
      if (input.hasAttribute(&quot;data-rel-null&quot;)) {
        root.querySelector(&quot;[data-rel-row-json]&quot;).disabled = input.checked;
      }
      if (input.closest(&#x27;[data-browse-panel=&quot;redis&quot;] .cc-object-toolbar&#x27;)) {
        showToast(&quot;Redis 筛选已更新 · &quot; + input.value);
      }
    });

    root.querySelector(&quot;[data-connection-search]&quot;).addEventListener(&quot;input&quot;, applyConnectionFilter);
    root.querySelector(&quot;[data-rel-object-search]&quot;).addEventListener(&quot;input&quot;, (event) =&gt; {
      renderRelationalTableList(event.target.value);
    });
    root.querySelector(&quot;[data-redis-search]&quot;).addEventListener(&quot;input&quot;, (event) =&gt; {
      redisVisibleCount = 40;
      renderRedisKeys(event.target.value);
    });
    root.querySelector(&quot;[data-mongo-search]&quot;).addEventListener(&quot;input&quot;, (event) =&gt; {
      mongoVisibleCount = 24;
      renderMongoDocuments(event.target.value);
    });
    root.querySelector(&quot;[data-etcd-search]&quot;).addEventListener(&quot;input&quot;, (event) =&gt; {
      etcdVisibleCount = 24;
      renderEtcdKeys(event.target.value);
    });
    activeRelationalTableNames = buildRelationalTableNames(relationalConfigs.postgres);
    renderRelationalTableList();
    renderRedisKeys();
    renderMongoDocuments();
    renderEtcdKeys();
    renderQueryAdapter(activeQueryAdapter);
    renderSshResources();
    refreshIcons();
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    initialize();
