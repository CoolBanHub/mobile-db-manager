name: dbx-public-databases

services:
  # 所有端口均由未跟踪的 .env 控制；公网使用前仍需 VPN、TLS 或源 IP 白名单。
  mysql:
    image: mysql:8.0
    container_name: dbx-public-mysql
    restart: unless-stopped
    ports:
      - "${DB_BIND_ADDRESS}:${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    container_name: dbx-public-postgresql
    restart: unless-stopped
    ports:
      - "${DB_BIND_ADDRESS}:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.4-bookworm
    container_name: dbx-internet-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --protected-mode
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports:
      - "${DB_BIND_ADDRESS}:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

  mongodb:
    image: mongo:8.2-noble
    container_name: dbx-internet-mongodb
    restart: unless-stopped
    ports:
      - "${DB_BIND_ADDRESS}:${MONGODB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_ROOT_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: dbx-internet-sqlserver
    restart: unless-stopped
    ports:
      - "${DB_BIND_ADDRESS}:${MSSQL_PORT}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  mongodb-data:
  sqlserver-data:
