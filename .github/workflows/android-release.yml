name: Android Release APK

on:
  push:
    tags:
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example release/v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and upload release asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            prerelease="false"
          else
            tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"
          fi

          if [[ "${tag}" != release/v* ]]; then
            echo "::error::Release tag must start with release/v, for example release/v0.1.0"
            exit 1
          fi

          version="${tag#release/v}"
          if [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Release tag must use release/vMAJOR.MINOR.PATCH, for example release/v0.1.0"
            exit 1
          fi

          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch} + 1))

          safe_tag="${tag//\//-}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=mobile-db-manager-${safe_tag}.apk" >> "${GITHUB_OUTPUT}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm test

      - name: Decode Android signing key
        env:
          MOBILE_DB_MANAGER_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_DB_MANAGER_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_DB_MANAGER_ANDROID_STORE_PASSWORD: ${{ secrets.MOBILE_DB_MANAGER_ANDROID_STORE_PASSWORD }}
          MOBILE_DB_MANAGER_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_DB_MANAGER_ANDROID_KEY_ALIAS }}
          MOBILE_DB_MANAGER_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_DB_MANAGER_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in \
            MOBILE_DB_MANAGER_ANDROID_KEYSTORE_BASE64 \
            MOBILE_DB_MANAGER_ANDROID_STORE_PASSWORD \
            MOBILE_DB_MANAGER_ANDROID_KEY_ALIAS \
            MOBILE_DB_MANAGER_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" != "0" ]]; then
            exit 1
          fi

          signing_dir="${RUNNER_TEMP}/mobile-db-manager-signing"
          mkdir -p "${signing_dir}"
          keystore_path="${signing_dir}/release.jks"
          printf "%s" "${MOBILE_DB_MANAGER_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          echo "MOBILE_DB_MANAGER_ANDROID_KEYSTORE=${keystore_path}" >> "${GITHUB_ENV}"
          echo "MOBILE_DB_MANAGER_ANDROID_STORE_PASSWORD=${MOBILE_DB_MANAGER_ANDROID_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "MOBILE_DB_MANAGER_ANDROID_KEY_ALIAS=${MOBILE_DB_MANAGER_ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "MOBILE_DB_MANAGER_ANDROID_KEY_PASSWORD=${MOBILE_DB_MANAGER_ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        env:
          MOBILE_DB_MANAGER_ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          MOBILE_DB_MANAGER_ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: pnpm android:build:release-apk

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/${{ steps.release.outputs.asset_name }}"

      - name: Verify APK signature
        shell: bash
        run: |
          apksigner verify --verbose --print-certs "release/${{ steps.release.outputs.asset_name }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          notes="Automated Android APK build for ${RELEASE_TAG}."
          asset="release/${ASSET_NAME}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${asset}" --clobber
          else
            args=(release create "${RELEASE_TAG}" "${asset}" --title "${RELEASE_TAG}" --notes "${notes}" --target "${GITHUB_SHA}")
            if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
